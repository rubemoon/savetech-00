    const tbody = document.querySelector('#linksTable tbody');
    const STORAGE_KEY = 'training_links_checklist';
    let checklist = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

    function saveChecklist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(checklist));
    }

    links.forEach(([cn, en, url], idx) => {
      const tr = document.createElement('tr');
      if (checklist[url]) tr.classList.add('read');
      const tdCheck = document.createElement('td');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!checklist[url];
      checkbox.addEventListener('change', () => {
        checklist[url] = checkbox.checked;
        saveChecklist();
        tr.classList.toggle('read', checkbox.checked);
      });
      tdCheck.appendChild(checkbox);
      tr.appendChild(tdCheck);
      tr.appendChild(Object.assign(document.createElement('td'), {textContent: cn}));
      tr.appendChild(Object.assign(document.createElement('td'), {textContent: en}));
      const tdLink = document.createElement('td');
      const a = document.createElement('a');
      a.href = url;
      a.textContent = url;
      a.target = '_blank';
      tdLink.appendChild(a);
      tr.appendChild(tdLink);
      tbody.appendChild(tr);
    });
